plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tlean07.totvs'
    compileSdk 36

    defaultConfig {
        applicationId "com.tlean07.totvs"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Production backend (Render, branch "oracle" -> Oracle Database FIAP). The web app and this app share it.
        buildConfigField "String", "API_BASE_URL", "\"https://challenge-totvs-backend-oracle.onrender.com/api/\""
    }

    buildTypes {
        debug {
            // Defaults to the shared Render backend (Oracle) so the app works out of the box.
            // For a local backend, swap to: "http://10.0.2.2:8080/api/" (emulator loopback).
            buildConfigField "String", "API_BASE_URL", "\"https://challenge-totvs-backend-oracle.onrender.com/api/\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.core.splashscreen
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Networking
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // Secure storage + biometrics + passkeys
    implementation libs.security.crypto
    implementation libs.biometric
    implementation libs.credentials
    implementation libs.credentials.play.services

    // Offline speech recognition (Kaldi) for the meeting recorder; the pt-BR model is downloaded on first use.
    implementation libs.vosk.android

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
