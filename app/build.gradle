plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tlean07.totvs'
    compileSdk 36

    defaultConfig {
        applicationId "com.tlean07.totvs"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Production backend (Render, branch "oracle" -> Oracle Database FIAP). The web app and this app share it.
        buildConfigField "String", "API_BASE_URL", "\"https://challenge-totvs-backend-oracle.onrender.com/api/\""
    }

    buildTypes {
        debug {
            // Defaults to the shared Render backend (Oracle) so the app works out of the box.
            // For a local backend, swap to: "http://10.0.2.2:8080/api/" (emulator loopback).
            buildConfigField "String", "API_BASE_URL", "\"https://challenge-totvs-backend-oracle.onrender.com/api/\""
            // R8 also on debug: the unshrunk dex alone is ~19 MB; keep rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    // One APK per CPU so a phone only downloads its own Vosk/JNA binaries (~10 MB instead of 40 MB);
    // the universal APK is still produced for the emulator and sideloading.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
}

// sherpa-onnx (speaker diarization: pyannote segmentation + speaker embeddings, ONNX Runtime).
// The AAR is 50 MB and not committed; it is fetched from the GitHub release on first build.
def sherpaVersion = "1.13.8"
def sherpaAar = file("libs/sherpa-onnx-${sherpaVersion}.aar")
tasks.register("downloadSherpaOnnx") {
    outputs.file(sherpaAar)
    doLast {
        if (!sherpaAar.exists()) {
            sherpaAar.parentFile.mkdirs()
            def url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${sherpaVersion}/sherpa-onnx-${sherpaVersion}.aar"
            logger.lifecycle("Baixando ${url}")
            new URL(url).withInputStream { i -> sherpaAar.withOutputStream { o -> o << i } }
        }
    }
}
preBuild.dependsOn "downloadSherpaOnnx"

dependencies {
    implementation files(sherpaAar)
    // the sherpa AAR is written in Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout
    implementation libs.core.splashscreen
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Networking
    implementation libs.retrofit
    implementation libs.retrofit.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // Secure storage + biometrics + passkeys
    implementation libs.security.crypto
    implementation libs.biometric
    implementation libs.credentials
    implementation libs.credentials.play.services

    // Offline speech recognition (Kaldi) for the meeting recorder; the pt-BR model is downloaded on first use.
    implementation libs.vosk.android

    // LeanIA local analyzer (same Java port the backend runs) uses Lombok DTOs; background alert polling uses WorkManager.
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    implementation libs.work.runtime

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
